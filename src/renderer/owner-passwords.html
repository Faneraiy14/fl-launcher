<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Паролі овнера</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #121214;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h2 {
            color: #2ecc71;
            margin-bottom: 20px;
        }
        h3 {
            color: #e4e4e7;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .auth-area,
        .passwords-area,
        .add-area,
        .change-password-area {
            background: #1a1a22;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #27272a;
        }
        input {
            width: 100%;
            padding: 10px;
            background: #0e0e11;
            border: 1px solid #27272a;
            border-radius: 6px;
            color: #fff;
            margin-bottom: 10px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #2ecc71;
        }
        button {
            background: #2ecc71;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: all 0.2s;
        }
        button:hover {
            background: #27ae60;
            transform: translateY(-1px);
        }
        button.danger {
            background: #e74c3c;
        }
        button.danger:hover {
            background: #c0392b;
        }
        button.warning {
            background: #f39c12;
        }
        button.warning:hover {
            background: #e67e22;
        }
        .password-item {
            background: #0e0e11;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #27272a;
        }
        .hidden {
            display: none;
        }
        .service {
            font-weight: bold;
            color: #2ecc71;
        }
        .username {
            color: #a1a1aa;
            font-size: 12px;
            margin-top: 4px;
        }
        .delete-btn {
            background: #e74c3c;
            padding: 5px 10px;
            font-size: 12px;
            width: auto;
        }
        .delete-btn:hover {
            background: #c0392b;
        }
        .info {
            font-size: 12px;
            color: #71717a;
            margin-top: 10px;
            text-align: center;
        }
        .warning-text {
            color: #f39c12;
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
        }
        .success-text {
            color: #2ecc71;
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
        }
        .error-text {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
        }
        .flex-row {
            display: flex;
            gap: 10px;
        }
        .flex-row button {
            flex: 1;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>🔐 Паролі овнера</h2>
    
    <div id="authPanel" class="auth-area">
        <h3>Master-пароль</h3>
        <input type="password" id="masterPassword" placeholder="Введіть master-пароль">
        <button id="authBtn">Увійти</button>
        <div id="factoryWarning" class="warning-text hidden">
            ⚠️ ВИКОРИСТОВУЄТЬСЯ ЗАВОДСЬКИЙ ПАРОЛЬ!<br>
            Після входу обов'язково змініть його!
        </div>
    </div>
    
    <div id="mainPanel" class="hidden">
        <div class="change-password-area">
            <h3>🔐 Змінити master-пароль</h3>
            <input type="password" id="oldPassword" placeholder="Поточний пароль">
            <input type="password" id="newPassword" placeholder="Новий пароль (мін. 8 символів)">
            <input type="password" id="confirmPassword" placeholder="Підтвердіть новий пароль">
            <button id="changePasswordBtn" class="warning">Змінити пароль</button>
            <div id="changePasswordMessage"></div>
        </div>
        
        <div class="add-area">
            <h3>➕ Додати пароль</h3>
            <input type="text" id="service" placeholder="Назва сервісу/сайту">
            <input type="text" id="accUsername" placeholder="Логін">
            <input type="password" id="accPassword" placeholder="Пароль">
            <button id="addBtn">Зберегти пароль</button>
        </div>
        
        <div class="passwords-area">
            <h3>📋 Збережені паролі</h3>
            <div id="passwordsList"></div>
        </div>
    </div>
</div>

<script>
    let isAuth = false;

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function showMessage(elementId, message, type) {
        const element = document.getElementById(elementId);
        if (element) {
            element.innerHTML = message;
            element.className = type === 'error' ? 'error-text' : (type === 'success' ? 'success-text' : 'warning-text');
            setTimeout(() => {
                if (element) element.innerHTML = '';
            }, 3000);
        }
    }

    async function checkFactoryPasswordStatus() {
        try {
            const isUsingFactory = await window.api.invoke('owner-is-using-factory');
            const warningDiv = document.getElementById('factoryWarning');
            if (warningDiv && isUsingFactory) {
                warningDiv.classList.remove('hidden');
            } else if (warningDiv) {
                warningDiv.classList.add('hidden');
            }
        } catch (err) {
            console.error('[OWNER_PASS] checkFactoryPasswordStatus error:', err);
        }
    }

    async function loadPasswords() {
        try {
            const passwords = await window.api.invoke('owner-get-passwords');
            const listDiv = document.getElementById('passwordsList');
            if (!listDiv) return;
            
            listDiv.innerHTML = '';
            if (!passwords || passwords.length === 0) {
                listDiv.innerHTML = '<div class="info">Немає збережених паролів</div>';
            } else {
                for (const p of passwords) {
                    const div = document.createElement('div');
                    div.className = 'password-item';
                    div.innerHTML = `
                        <div>
                            <div class="service">${escapeHtml(p.service)}</div>
                            <div class="username">${escapeHtml(p.username)}</div>
                        </div>
                        <button class="delete-btn" data-service="${escapeHtml(p.service)}">🗑️</button>
                    `;
                    const delBtn = div.querySelector('.delete-btn');
                    if (delBtn) {
                        delBtn.onclick = () => {
                            const service = delBtn.getAttribute('data-service');
                            if (confirm(`Видалити пароль для "${service}"?`)) {
                                window.api.send('owner-delete-password', service);
                            }
                        };
                    }
                    listDiv.appendChild(div);
                }
            }
        } catch (err) {
            console.error('[OWNER_PASS] loadPasswords error:', err);
        }
    }

    // Ініціалізація після завантаження DOM
    document.addEventListener('DOMContentLoaded', () => {
        // Авторизація
        const authBtn = document.getElementById('authBtn');
        const masterPassword = document.getElementById('masterPassword');
        
        if (authBtn && masterPassword) {
            authBtn.onclick = () => {
                const pwd = masterPassword.value;
                if (!pwd) {
                    alert('Введіть master-пароль!');
                    return;
                }
                window.api.send('owner-check-master', pwd);
            };
            
            masterPassword.onkeypress = (e) => {
                if (e.key === 'Enter') {
                    authBtn.click();
                }
            };
        }
        
        // Зміна пароля
        const changePasswordBtn = document.getElementById('changePasswordBtn');
        if (changePasswordBtn) {
            changePasswordBtn.onclick = async () => {
                const oldPwd = document.getElementById('oldPassword')?.value;
                const newPwd = document.getElementById('newPassword')?.value;
                const confirmPwd = document.getElementById('confirmPassword')?.value;
                
                if (!oldPwd || !newPwd || !confirmPwd) {
                    showMessage('changePasswordMessage', 'Заповніть всі поля!', 'error');
                    return;
                }
                
                if (newPwd.length < 8) {
                    showMessage('changePasswordMessage', 'Новий пароль має бути не менше 8 символів!', 'error');
                    return;
                }
                
                if (newPwd !== confirmPwd) {
                    showMessage('changePasswordMessage', 'Паролі не співпадають!', 'error');
                    return;
                }
                
                try {
                    const result = await window.api.invoke('owner-change-password', { oldPassword: oldPwd, newPassword: newPwd });
                    if (result && result.success) {
                        showMessage('changePasswordMessage', '✅ Пароль успішно змінено!', 'success');
                        document.getElementById('oldPassword').value = '';
                        document.getElementById('newPassword').value = '';
                        document.getElementById('confirmPassword').value = '';
                        checkFactoryPasswordStatus();
                    } else {
                        showMessage('changePasswordMessage', result?.error || '❌ Помилка зміни пароля', 'error');
                    }
                } catch (err) {
                    showMessage('changePasswordMessage', '❌ Помилка: ' + err.message, 'error');
                }
            };
        }
        
        // Додавання пароля
        const addBtn = document.getElementById('addBtn');
        if (addBtn) {
            addBtn.onclick = () => {
                const service = document.getElementById('service')?.value.trim();
                const username = document.getElementById('accUsername')?.value.trim();
                const password = document.getElementById('accPassword')?.value;
                
                if (!service || !username || !password) {
                    alert('Заповніть всі поля!');
                    return;
                }
                
                window.api.send('owner-add-password', { service, username, password });
                
                document.getElementById('service').value = '';
                document.getElementById('accUsername').value = '';
                document.getElementById('accPassword').value = '';
            };
        }
        
        // Результат авторизації
        window.api.on('owner-auth-result', (result) => {
            if (result && result.success) {
                isAuth = true;
                document.getElementById('authPanel').classList.add('hidden');
                document.getElementById('mainPanel').classList.remove('hidden');
                loadPasswords();
                checkFactoryPasswordStatus();
            } else {
                alert('Невірний master-пароль!');
            }
        });
        
        // Оновлення списку паролів
        window.api.on('owner-passwords-updated', () => {
            if (isAuth) loadPasswords();
        });
        
        // Перевірка статусу заводського пароля
        checkFactoryPasswordStatus();
    });
</script>
</body>
</html>
