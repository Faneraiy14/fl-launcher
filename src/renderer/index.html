<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FL Launcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <div class="sidebar">
            <div class="logo-container">
                <div class="logo-triangle">FL</div>
                <span class="logo-text">FL Launcher</span>
            </div>
            <button id="addBtn">+ Створити збірку</button>
            <div id="list"></div>
            <div class="sidebar-footer">
                <button id="checkUpdatesBtn" class="sidebar-update">🔄 Перевірити оновлення</button>
                <button id="ownerPassBtn" class="sidebar-pass">🔐 Паролі</button>
                <button id="aboutBtnSidebar" class="sidebar-about">ℹ️ Про лаунчер</button>
            </div>
        </div>

        <div class="main">
            <div class="card" id="settingsCard" style="display:none;">
                <h2 id="title" style="margin-top: 0; margin-bottom: 20px;">Налаштування</h2>
                <div class="form-grid">
                    <div class="form-column">
                        <label for="editName">Назва збірки</label>
                        <input type="text" id="editName" placeholder="Назва збірки">
                        <label for="user">Ігровий нікнейм</label>
                        <input type="text" id="user" placeholder="Ігровий нікнейм">
                        <label for="password">Пароль (Premium аккаунт)</label>
                        <input type="password" id="password" placeholder="Залиште порожнім для офлайн режиму">
                        <label for="customPath">Кастомна папка гри</label>
                        <input type="text" id="customPath" placeholder="Дефолт: папка лаунчера /instances">
                    </div>
                    <div class="form-column">
                        <label for="ver">Версія гри</label>
                        <select id="ver"></select>
                        <label for="loader">Мод-лоадер</label>
                        <select id="loader">
                            <option value="Vanilla">Vanilla</option>
                            <option value="fabric">Fabric</option>
                            <option value="forge">Forge</option>
                            <option value="neoforge">NeoForge</option>
                        </select>
                        <label id="ramLabel" for="ramRange">Виділена пам'ять: 4096 MB</label>
                        <input type="range" id="ramRange" min="1024" max="16384" step="512" value="4096">
                        <label>Поточний скін</label>
                        <div class="skin-preview">
                            <img id="skinPreviewImg" src="https://minotar.net/helm/steve/50.png" width="50" height="50" alt="Skin preview">
                            <button id="changeSkinBtn" class="small-btn">Змінити скін</button>
                        </div>
                    </div>
                </div>
                <div class="action-zone">
                    <div class="action-buttons">
                        <button id="saveBtn" class="save-btn">💾 ЗБЕРЕГТИ</button>
                        <button id="folderBtn" class="folder-btn">📁 ПАПКА ГРИ</button>
                        <button id="logBtn" class="log-btn">📋 ЛОГИ</button>
                        <button id="modsBtn" class="mods-btn">📦 МОДИ</button>
                    </div>
                    <button id="playBtn" class="play">🎮 ГРАТИ</button>
                    <div class="status-container">
                        <p id="statusText" class="status-text">Статус: готовий</p>
                        <div class="progress-container" style="display: none;">
                            <div id="progressBar" class="progress-bar"></div>
                        </div>
                        <p id="subStatusText" class="sub-status-text"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="contextMenu" class="context-menu hidden">
        <button id="editInstBtn">✏️ Редагувати</button>
        <button id="delInstBtn" class="delete-btn">🗑️ Видалити</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
