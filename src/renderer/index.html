<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fl Launcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- ЛІВА ПАНЕЛЬ (САЙДБАР) -->
        <div class="sidebar">
            <div class="logo-container">
                <div class="logo-triangle">FL</div>
                <span class="logo-text">Fl Launcher</span>
            </div>
            <button id="addBtn">+ Створити збірку</button>
            <div id="list"></div>
        </div>

        <!-- ГОЛОВНА ЧАСТИНА -->
        <div class="main">
            <div class="card" id="settingsCard" style="display:none;">
                <h2 id="title" style="margin-top: 0; margin-bottom: 20px;">Налаштування</h2>
                
                <!-- СІТКА НАЛАШТУВАНЬ НА ДВІ КОЛОНКИ -->
                <div class="form-grid">
                    <!-- ЛІВА КОЛОНКА -->
                    <div class="form-column">
                        <label for="editName">Назва збірки</label>
                        <input type="text" id="editName" placeholder="Назва збірки">
                        
                        <label for="user">Ігровий нікнейм</label>
                        <input type="text" id="user" placeholder="Ігровий нікнейм">
                        
                        <label for="customPath">Кастомна папка гри</label>
                        <input type="text" id="customPath" placeholder="Дефолт: папка лаунчера /instances">
                    </div>
                    <!-- ПРАВА КОЛОНКА -->
                    <div class="form-column">
                        <label for="ver">Версія гри</label>
                        <select id="ver"></select>
                        
                        <label for="loader">Мод-лоадер</label>
                        <select id="loader">
                            <option value="Vanilla">Vanilla</option>
                            <option value="Fabric">Fabric</option>
                            <option value="Forge">Forge</option>
                            <option value="NeoForge">NeoForge</option>
                        </select>
                        
                        <label id="ramLabel" for="ramRange">Виділена пам'ять: 4096 MB</label>
                        <input type="range" id="ramRange" min="1024" max="16384" step="512" value="4096">
                    </div>
                </div>

                <!-- НИЖНЯ ЗОНА КНОПОК ТА СТАТУСУ -->
                <div class="action-zone" style="margin-top: 20px; border-top: 1px solid #27272a; padding-top: 15px;">
                    <button id="saveBtn">ЗБЕРЕГТИ НАЛАШТУВАННЯ</button>
                    <div style="display: flex; gap: 10px;">
                        <button id="folderBtn">ПАПКА ГРИ</button>
                        <button id="logBtn" style="background: #2980b9;">ЛОГИ ГРИ</button>
                    </div>
                    <button id="playBtn" class="play">ГРАТИ</button>
                    
                    <!-- Блок статусів та прогресу завантаження -->
                    <div class="status-container" style="margin-top: 15px;">
                        <p id="statusText" style="margin: 5px 0; font-weight: 600;">Статус: готовий</p>
                        <div class="progress-container" style="display: none; background: #27272a; border-radius: 6px; height: 8px; overflow: hidden; margin: 8px 0;">
                            <div id="progressBar" class="progress-bar" style="width: 0%; background: #2ecc71; height: 100%; transition: width 0.1s linear;"></div>
                        </div>
                        <p id="subStatusText" style="margin: 5px 0; color: #a1a1aa; font-size: 13px;"></p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- КОНТЕКСТНЕ МЕНЮ -->
    <div id="contextMenu" class="hidden">
        <button onclick="editInst()">Редагувати</button>
        <button onclick="delInst()" class="del-btn-style">Видалити</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
